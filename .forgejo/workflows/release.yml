# The release flow (infra hosts/nixnas-release-publish.nix, lane RF1 2026-11-06). Not generated by ccid.
# A pushed release tag (vX.Y.Z; aur/<pkgver>-<pkgrel> for an AUR packaging release) hands this commit to srv: the job
# writes the request file and starts release-publish@<commit>, which builds with the host's Nix toolchain and publishes
# with each registry's own CLI. The job holds NO registry key and builds nothing; the unit reads the tags, the commit
# signature and the CI result from the forge itself. A manual run is a dry run of the main commit (release-publish-dry@,
# nothing is uploaded). Outcome: the commit status `release-publish` (real runs), the unit log, the job-template-failed row.
name: release
on:
  push:
    tags: ["v*", "aur/*"]
  workflow_dispatch:
    inputs:
      only:
        description: "dry run: the registries to rehearse, space-separated (crates npm jsr pypi aur); empty = all"
        type: string
        default: ""
jobs:
  publish:
    runs-on: linux
    timeout-minutes: 5
    steps:
      - name: Hand the commit to the release unit of srv
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/*) unit=release-publish; ONLY= ;;
            refs/heads/main) unit=release-publish-dry ;;
            *) echo "release runs on a tag or on main (this is $GITHUB_REF)" >&2; exit 2 ;;
          esac
          case "${ONLY:-}" in *[!a-z\ ]*) echo "only: registry names separated by spaces" >&2; exit 2 ;; esac
          dir=/var/lib/forgejo-runner/requests/release
          printf 'REPO=%s\nONLY=%s\n' "$GITHUB_REPOSITORY" "${ONLY:-}" > "$dir/.$GITHUB_SHA.tmp"
          mv -f "$dir/.$GITHUB_SHA.tmp" "$dir/$GITHUB_SHA"
          instance="$unit@$GITHUB_SHA.service"
          # --no-block: the job only starts the unit; releases queue on the unit's own flock (one upload run at a time)
          /run/current-system/sw/bin/systemctl start --no-block "$instance"
          echo "started $instance; follow it with: journalctl -u $instance or /var/lib/manual-units/logs/$instance.log (a failure raises the job-template-failed alert; a real run sets the commit status release-publish)"
