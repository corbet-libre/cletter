schema = 1
project = "cletter"

# Select affected checks explicitly; no implicit full language/platform matrix.
[checks.rust]
kind = "cargo"
actions = ["fmt", "test", "clippy"]

[checks.fmt]
kind = "cargo"
actions = ["fmt"]

[checks.metadata]
kind = "commands"
commands = [["python3", ".ci/check.py", "metadata"]]

[checks.javascript]
kind = "commands"
commands = [["python3", ".ci/check.py", "javascript"]]

[checks.rust-package]
kind = "commands"
commands = [["python3", ".ci/check.py", "rust-package"]]

[checks.rust-dependencies]
kind = "commands"
commands = [["python3", ".ci/check.py", "rust-dependencies"]]

[checks.resolve-dependencies]
kind = "commands"
commands = [["python3", ".ci/check.py", "resolve-dependencies"]]

[checks.js-package]
kind = "commands"
commands = [["python3", ".ci/check.py", "js-package"]]

[checks.js-pnpm]
kind = "commands"
commands = [["python3", ".ci/check.py", "js-pnpm"]]

[checks.js-yarn]
kind = "commands"
commands = [["python3", ".ci/check.py", "js-yarn"]]

[checks.js-bun]
kind = "commands"
commands = [["python3", ".ci/check.py", "js-bun"]]

[checks.python-package]
kind = "commands"
commands = [["python3", ".ci/check.py", "python-package"]]

[checks.typst-package]
kind = "commands"
commands = [["python3", ".ci/check.py", "typst-package"]]

[checks.typst-conformance]
kind = "commands"
commands = [["python3", ".ci/check.py", "typst-conformance"]]

[checks.published-npm]
kind = "commands"
commands = [["python3", ".ci/check.py", "published-npm"]]

[checks.published-jsr]
kind = "commands"
commands = [["python3", ".ci/check.py", "published-jsr"]]

[checks.published-python]
kind = "commands"
commands = [["python3", ".ci/check.py", "published-python"]]

# Manual publication adapter; no product compilation occurs.
[checks.release]
kind = "commands"
commands = [["python3", ".ci/publish.py"]]

# Syntax and manual publication contract; no product build or network.
[checks.release-config]
kind = "commands"
commands = [["python3", ".ci/release-check.py"]]

[checks.typst-family-preview]
kind = "commands"
commands = [["python3", ".ci/check.py", "typst-family-preview"]]

# The release's own selector runs from its separately pinned historical archive.
[checks.published-python-release]
kind = "commands"
commands = [["python3", ".ci/published-python-release.py"]]

# verify aggregates the cached subset of the hosted Linux route (ci.yml case branches):
# rust + ccid-defined standalone packaging/integration selectors in dependency
# order. Registry/live-read selectors run FRESH after the cached verify via `ccid check`
# (never `cached`): published-npm/jsr/python (+ resolve-dependencies for cletter;
# licenses + jsr-registry + python-registry for ccht). Publication and artifact-manifest
# selectors (release, rust-dependencies, typst-preview, registry-resolved previews) stay
# defined and callable via the old ccid route; they are not in the default job.
# No cache_inputs (broad default); no cache_outputs (packaging receipts land in ARTIFACT_ROOT,
# outside the repo tree); no cache_env (no shells; dynamic paths must not key the cache).
# No deny.toml ships, so there is no advisories check; freshness is carried by the
# per-selector fresh checks above instead.

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
# The family siblings the typst checks read (staged by the job's `siblings`): their resolved commits key the cached result.
cache_env = ["CCID_SIBLINGS_REVISIONS"]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["node", "--version"], ["bun", "--version"], ["npm", "--version"], ["deno", "--version"], ["uv", "--version"]]

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify", "published-npm", "published-jsr", "published-python", "resolve-dependencies"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["push", "manual"]
siblings = { cdate = "main", cink = "main", cnice = "main" }
